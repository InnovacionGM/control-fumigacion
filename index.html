<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Fumigación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --teal:#0F6E56; --teal-dark:#085041; --teal-light:#E1F5EE;
    --amber:#BA7517; --red:#A32D2D; --green:#3B6D11;
    --bg:#F7F7F5; --card:#FFFFFF; --border:#E1E0D9;
    --text:#2C2C2A; --text-muted:#5F5E5A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--teal-dark);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  header h1{font-size:16px;font-weight:600;}
  header .user-info{font-size:12px;opacity:.85;text-align:right;}
  #logout-btn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;margin-left:8px;}
  nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--border);}
  nav button{flex:none;padding:12px 16px;background:none;border:none;font-size:13px;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;}
  nav button.active{color:var(--teal-dark);border-bottom-color:var(--teal);font-weight:600;}
  main{padding:16px;max-width:900px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;}
  .card h2{font-size:15px;margin-bottom:12px;color:var(--teal-dark);}
  label{display:block;font-size:12px;color:var(--text-muted);margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:#fff;}
  textarea{resize:vertical;min-height:60px;}
  button.primary{margin-top:14px;width:100%;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;}
  button.secondary{margin-top:8px;width:100%;padding:10px;background:#fff;color:var(--teal-dark);border:1px solid var(--teal);border-radius:6px;font-size:13px;}
  .msg{margin-top:10px;padding:8px 10px;border-radius:6px;font-size:13px;}
  .msg.error{background:#FCEBEB;color:var(--red);}
  .msg.ok{background:var(--teal-light);color:var(--teal-dark);}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .kpi .label{font-size:11px;color:var(--text-muted);}
  .kpi .value{font-size:22px;font-weight:600;margin-top:2px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filters button{padding:7px 12px;border:1px solid var(--border);background:#fff;border-radius:20px;font-size:12px;}
  .filters button.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
  .badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.pendiente{background:#FAEEDA;color:var(--amber);}
  .badge.realizado{background:var(--teal-light);color:var(--teal-dark);}
  .badge.alta{background:#FCEBEB;color:var(--red);}
  .hidden{display:none !important;}
  .heat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
  .heat-cell{border-radius:10px;padding:12px;}
  .heat-cell .b{font-size:12px;}
  .heat-cell .p{font-size:20px;font-weight:600;margin-top:2px;}
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  #login-card{max-width:340px;width:100%;}
  .user-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .user-row .role{font-size:11px;color:var(--text-muted);}
  .inactive-row{opacity:.5;}
  #refresh-btn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;padding:4px 9px;border-radius:6px;font-size:14px;margin-left:8px;line-height:1;}
  #loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:999;color:#fff;font-size:14px;}
  #loading-spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:girar .7s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="card" id="login-card">
    <h2>Control de Fumigación</h2>
    <label>Código de acceso</label>
    <input type="text" id="login-clave" placeholder="Ej. CC4821" maxlength="10" style="text-transform:uppercase;letter-spacing:1px;font-size:18px;text-align:center;" autocomplete="off">
    <button class="primary" onclick="doLogin()">Entrar</button>
    <div id="login-msg"></div>
    <script>document.getElementById('login-clave').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });</script>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>Control de Fumigación</h1>
    <div class="user-info">
      <span id="user-name"></span><br>
      <span id="user-role"></span>
      <button id="refresh-btn" onclick="actualizarVistaActual()" title="Actualizar" aria-label="Actualizar">⟳</button>
      <button id="logout-btn" onclick="logout()">Salir</button>
    </div>
  </header>

  <div id="loading-overlay" class="hidden">
    <div id="loading-spinner"></div>
    <span>Un momento...</span>
  </div>

  <nav id="nav-tabs"></nav>

  <main>
    <!-- CAPTURAR REPORTE -->
    <section id="tab-capturar" class="card hidden">
      <h2>Reportar incidencia de insecto</h2>
      <label>Área</label>
      <select id="cap-area" onchange="toggleHabitacionField()"></select>
      <div id="cap-hab-wrap">
        <label>Habitación</label>
        <input type="text" id="cap-habitacion" placeholder="Ej. 5203">
      </div>
      <label>Tipo de insecto</label>
      <select id="cap-insecto"></select>
      <label>Observaciones (opcional)</label>
      <textarea id="cap-obs"></textarea>
      <label>Foto (opcional)</label>
      <input type="file" id="cap-foto" accept="image/*">
      <button class="primary" onclick="enviarReporte()">Guardar reporte</button>
      <div id="cap-msg"></div>
    </section>

    <!-- PREVENTIVO -->
    <section id="tab-preventivo" class="card hidden">
      <h2>Fumigación preventiva de habitación</h2>
      <label>Número de habitación</label>
      <input type="text" id="prev-habitacion" placeholder="Ej. 5203">
      <button class="primary" onclick="registrarPreventivoUI()">Guardar</button>
      <div id="prev-msg"></div>
      <hr style="margin:16px 0;border:none;border-top:1px solid var(--border)">
      <h2>Registros recientes</h2>
      <div id="prev-lista"></div>
    </section>

    <!-- REPORTES / CERRAR -->
    <section id="tab-reportes" class="card hidden">
      <h2>Reportes correctivos</h2>
      <div class="filters" id="reportes-filtros">
        <button data-f="todos" class="active">Todos</button>
        <button data-f="pendiente">Pendientes</button>
        <button data-f="realizado">Realizados</button>
        <button data-f="alta">Alta severidad</button>
      </div>
      <button class="secondary" onclick="exportarPDFSeleccionados()">Exportar PDF de seleccionados</button>
      <div id="reportes-lista" style="margin-top:10px;"></div>
    </section>

    <!-- DASHBOARD -->
    <section id="tab-dashboard" class="hidden">
      <div class="filters" id="dash-filtros">
        <button data-r="hoy" class="active">Hoy</button>
        <button data-r="ayer">Ayer</button>
        <button data-r="semana">Esta semana</button>
        <button data-r="rango">Rango</button>
      </div>
      <div id="rango-fechas" class="hidden" style="display:flex;gap:8px;margin-bottom:14px;">
        <input type="date" id="rango-desde">
        <input type="date" id="rango-hasta">
        <button class="secondary" onclick="cargarDashboard()">Aplicar</button>
      </div>
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="card">
        <h2>Reportes por tipo de insecto</h2>
        <div style="position:relative;height:220px"><canvas id="chart-insecto"></canvas></div>
      </div>
      <div class="card">
        <h2>Reportes por área</h2>
        <div style="position:relative;height:220px"><canvas id="chart-area"></canvas></div>
      </div>
      <div class="card">
        <h2>Cobertura preventiva por edificio (últimos 15 días)</h2>
        <div class="heat-grid" id="heat-grid"></div>
      </div>
      <button class="secondary" onclick="exportarPDF()">Exportar PDF</button>
      <button class="secondary" onclick="compartir()">Compartir</button>
    </section>

    <!-- USUARIOS -->
    <section id="tab-usuarios" class="card hidden">
      <h2>Usuarios</h2>
      <div id="crear-usuario-wrap">
        <label>Nombre</label>
        <input type="text" id="us-nombre">
        <label>Email</label>
        <input type="email" id="us-email">
        <label>Rol</label>
        <select id="us-rol"></select>
        <button class="primary" onclick="crearUsuarioUI()">Crear usuario</button>
        <div id="us-msg"></div>
      </div>
      <hr style="margin:16px 0;border:none;border-top:1px solid var(--border)">
      <div id="lista-usuarios"></div>
    </section>
  </main>
</div>

<script>
// ============ CONFIGURACION ============
// Pegar aqui la URL del Web App despues de implementar el Code.gs
const API_URL = 'https://script.google.com/macros/s/AKfycbykosmCSSYmWNEqRZE6_6vLDAIHZfW-2n6RW3M9e6kM0Az2jw2uyL05VWVYPqRTeOY7/exec';

let SESSION = null;
let CATALOGOS = { areas: [], insectos: [], habitaciones: [] };

let solicitudesActivas = 0;
function mostrarCargando(mostrar) {
  solicitudesActivas = Math.max(0, solicitudesActivas + (mostrar ? 1 : -1));
  document.getElementById('loading-overlay').classList.toggle('hidden', solicitudesActivas <= 0);
}

function callApi(accion, params) {
  const body = new URLSearchParams({ accion, ...params });
  const controlador = new AbortController();
  const timeoutId = setTimeout(() => controlador.abort(), 20000);
  mostrarCargando(true);
  return fetch(API_URL, { method: 'POST', body, signal: controlador.signal })
    .then(r => r.json())
    .then(res => {
      if (!res.ok) throw new Error(res.error);
      return res.data;
    })
    .catch(err => {
      if (err.name === 'AbortError') throw new Error('El sistema no respondió a tiempo. Revisa tu conexión e intenta de nuevo.');
      if (err instanceof TypeError) throw new Error('No se pudo conectar. Revisa tu conexión (wifi o datos) e intenta de nuevo.');
      throw err;
    })
    .finally(() => { clearTimeout(timeoutId); mostrarCargando(false); });
}

// ============ LOGIN ============
function doLogin() {
  const clave = document.getElementById('login-clave').value.trim();
  callApi('login', { clave })
    .then(user => {
      SESSION = user;
      localStorage.removeItem('dummy'); // no se usa localStorage para datos de sesion persistente por regla del sistema
      iniciarApp();
    })
    .catch(err => {
      document.getElementById('login-msg').innerHTML = '<div class="msg error">' + err.message + '</div>';
    });
}

function logout() {
  SESSION = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

// ============ NAV POR ROL ============
const TABS_POR_ROL = {
  Master:            ['capturar','preventivo','reportes','dashboard','usuarios'],
  CreadorProveedor:  ['capturar','preventivo','reportes','dashboard','usuarios'],
  CreadorOperacion:  ['capturar','reportes','dashboard','usuarios'],
  Fumigacion:        ['capturar','preventivo','reportes','dashboard'],
  Operacion:         ['capturar','reportes','dashboard']
};
const LABELS = { capturar:'Reportar', preventivo:'Preventivo', reportes:'Reportes', dashboard:'Dashboard', usuarios:'Usuarios' };

function iniciarApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-name').textContent = SESSION.nombre;
  document.getElementById('user-role').textContent = SESSION.rol;

  const tabs = TABS_POR_ROL[SESSION.rol] || ['capturar'];
  const nav = document.getElementById('nav-tabs');
  nav.innerHTML = '';
  tabs.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.textContent = LABELS[t];
    btn.onclick = () => mostrarTab(t, btn);
    if (i === 0) btn.classList.add('active');
    nav.appendChild(btn);
  });

  callApi('catalogos', {}).then(cat => {
    CATALOGOS = cat;
    poblarSelects();
  });

  mostrarTab(tabs[0], nav.querySelector('button'));
}

let TAB_ACTUAL = 'capturar';

function mostrarTab(tab, btnEl) {
  TAB_ACTUAL = tab;
  document.querySelectorAll('#nav-tabs button').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  ['capturar','preventivo','reportes','dashboard','usuarios'].forEach(t => {
    document.getElementById('tab-' + t).classList.add('hidden');
  });
  document.getElementById('tab-' + tab).classList.remove('hidden');
  if (tab === 'reportes') cargarReportes();
  if (tab === 'preventivo') cargarPreventivo();
  if (tab === 'dashboard') cargarDashboard();
  if (tab === 'usuarios') cargarUsuarios();
}

function actualizarVistaActual() {
  if (TAB_ACTUAL === 'reportes') cargarReportes();
  else if (TAB_ACTUAL === 'preventivo') cargarPreventivo();
  else if (TAB_ACTUAL === 'dashboard') cargarDashboard();
  else if (TAB_ACTUAL === 'usuarios') cargarUsuarios();
  else callApi('catalogos', {}).then(cat => { CATALOGOS = cat; poblarSelects(); });
}

function poblarSelects() {
  const areaSel = document.getElementById('cap-area');
  areaSel.innerHTML = CATALOGOS.areas.map(a => `<option value="${a}">${a}</option>`).join('');
  const insectoSel = document.getElementById('cap-insecto');
  insectoSel.innerHTML = CATALOGOS.insectos.map(i => `<option value="${i}">${i}</option>`).join('');
  toggleHabitacionField();

  const rolSel = document.getElementById('us-rol');
  const rolesPermitidos = {
    Master: ['Master','CreadorProveedor','CreadorOperacion','Fumigacion','Operacion'],
    CreadorProveedor: ['Fumigacion'],
    CreadorOperacion: ['Operacion']
  }[SESSION.rol] || [];
  if (rolSel) rolSel.innerHTML = rolesPermitidos.map(r => `<option value="${r}">${r}</option>`).join('');
}

function toggleHabitacionField() {
  const area = document.getElementById('cap-area').value;
  const esHabitacion = area === 'Habitacion';
  document.getElementById('cap-hab-wrap').classList.toggle('hidden', !esHabitacion);
  if (!esHabitacion) document.getElementById('cap-habitacion').value = ''; // nunca dejar un numero pegado de un area anterior
}

// ============ CAPTURAR REPORTE ============
function comprimirImagen(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1000;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      };
      img.onerror = () => reject(new Error('No se pudo procesar la imagen.'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer la imagen.'));
    reader.readAsDataURL(file);
  });
}

function fotoABase64(inputId) {
  const file = document.getElementById(inputId).files[0];
  return comprimirImagen(file);
}

function enviarReporte() {
  const area = document.getElementById('cap-area').value;
  const habitacion = area === 'Habitacion' ? document.getElementById('cap-habitacion').value.trim() : '';
  const tipoInsecto = document.getElementById('cap-insecto').value;
  const observaciones = document.getElementById('cap-obs').value.trim();

  fotoABase64('cap-foto').then(foto => {
    const data = { hotel: 'DRRPC', area, habitacion, tipoInsecto, usuarioReporta: SESSION.email, fotoInicial: foto, observaciones };
    callApi('crearReporte', { data: JSON.stringify(data) })
      .then(res => {
        document.getElementById('cap-msg').innerHTML =
          '<div class="msg ok">Reporte guardado. Este es el reporte número ' + res.conteoAcumulado + ' para esta habitación.</div>';
        document.getElementById('cap-area').selectedIndex = 0;
        document.getElementById('cap-habitacion').value = '';
        document.getElementById('cap-insecto').selectedIndex = 0;
        document.getElementById('cap-obs').value = '';
        document.getElementById('cap-foto').value = '';
        toggleHabitacionField();
      })
      .catch(err => {
        document.getElementById('cap-msg').innerHTML = '<div class="msg error">' + err.message + '</div>';
      });
  });
}

// ============ PREVENTIVO ============
function registrarPreventivoUI() {
  const habitacion = document.getElementById('prev-habitacion').value.trim();
  callApi('registrarPreventivo', { emailActor: SESSION.email, habitacion })
    .then(res => {
      document.getElementById('prev-msg').innerHTML = '<div class="msg ok">Fumigación preventiva registrada en ' + res.edificio + '.</div>';
      document.getElementById('prev-habitacion').value = '';
      cargarPreventivo();
    })
    .catch(err => {
      document.getElementById('prev-msg').innerHTML = '<div class="msg error">' + err.message + '</div>';
    });
}

function cargarPreventivo() {
  callApi('obtenerPreventivo', { filtros: JSON.stringify({ hotel: 'DRRPC' }) }).then(registros => {
    const cont = document.getElementById('prev-lista');
    if (!registros.length) { cont.innerHTML = '<p style="font-size:13px;color:var(--text-muted);">Sin registros todavía.</p>'; return; }
    cont.innerHTML = registros.slice(0, 30).map(r => `
      <div class="user-row">
        <div>Hab. ${r.habitacion} · ${r.edificio}<div class="role">${new Date(r.fechaHora).toLocaleString('es-DO')} · ${r.usuarioCaptura}</div></div>
        ${SESSION.rol === 'Master' ? `<button class="secondary" style="width:auto;padding:4px 10px;" onclick="borrarPreventivoUI('${r.id}')">Borrar</button>` : ''}
      </div>
    `).join('');
  });
}

function borrarPreventivoUI(id) {
  if (!confirm('¿Borrar este registro preventivo? Esta acción no se puede deshacer (a diferencia de inactivar usuarios, aquí sí se borra de verdad — úsalo solo para datos de prueba).')) return;
  callApi('borrarPreventivo', { emailActor: SESSION.email, id }).then(cargarPreventivo).catch(err => alert(err.message));
}

// ============ REPORTES / CERRAR ============
const PUEDE_CERRAR = ['Master','CreadorProveedor','Fumigacion'];
let REPORTES_CACHE = [];
let FILTRO_REPORTES = 'todos';

document.addEventListener('click', e => {
  if (e.target.matches('#reportes-filtros button')) {
    document.querySelectorAll('#reportes-filtros button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    FILTRO_REPORTES = e.target.dataset.f;
    pintarReportes();
  }
});

function irAReportesConFiltro(filtro) {
  FILTRO_REPORTES = filtro;
  const nav = document.getElementById('nav-tabs');
  const btn = Array.from(nav.querySelectorAll('button')).find(b => b.textContent === 'Reportes');
  mostrarTab('reportes', btn);
}

function cargarReportes() {
  callApi('obtenerReportes', { filtros: JSON.stringify({ hotel: 'DRRPC' }) }).then(reportes => {
    REPORTES_CACHE = reportes.slice().reverse();
    document.querySelectorAll('#reportes-filtros button').forEach(b => b.classList.toggle('active', b.dataset.f === FILTRO_REPORTES));
    pintarReportes();
  });
}

function pintarReportes() {
  const cont = document.getElementById('reportes-lista');
  let lista = REPORTES_CACHE;
  if (FILTRO_REPORTES === 'pendiente') lista = lista.filter(r => r.estado === 'Pendiente');
  else if (FILTRO_REPORTES === 'realizado') lista = lista.filter(r => r.estado === 'Realizado');
  else if (FILTRO_REPORTES === 'alta') lista = lista.filter(r => r.severidad === 'Alta');

  if (!lista.length) { cont.innerHTML = '<p>Sin reportes en este filtro.</p>'; return; }
  cont.innerHTML = lista.map(r => `
    <div class="card" style="margin-bottom:8px;padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <label style="display:flex;gap:8px;align-items:flex-start;flex:1;">
          <input type="checkbox" class="chk-reporte" value="${r.id}" style="margin-top:4px;">
          <strong>${r.area}${r.habitacion ? ' · Hab. ' + r.habitacion : ''}</strong>
        </label>
        <span class="badge ${r.estado === 'Pendiente' ? 'pendiente' : 'realizado'}">${r.estado}</span>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">
        ${r.tipoInsecto} · ${new Date(r.fechaHora).toLocaleString('es-DO')}
        ${r.severidad === 'Alta' ? ' · <span class="badge alta">Alta severidad</span>' : ''}
      </div>
      ${r.observaciones ? '<div style="font-size:13px;margin-top:6px;">' + r.observaciones + '</div>' : ''}
      ${r.fotoInicial ? '<img src="' + r.fotoInicial + '" style="max-width:100%;border-radius:8px;margin-top:8px;display:block;">' : ''}
      ${r.estado === 'Realizado' ? `
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
          <div style="font-size:12px;color:var(--text-muted);">Evidencia de cierre · ${r.usuarioCierre}</div>
          ${r.fotoEvidencia ? '<img src="' + r.fotoEvidencia + '" style="max-width:100%;border-radius:8px;margin-top:6px;display:block;">' : ''}
          <div style="font-size:13px;margin-top:6px;">${r.comentarioCierre}</div>
        </div>` : ''}
      ${r.estado === 'Pendiente' && PUEDE_CERRAR.indexOf(SESSION.rol) !== -1 ? `
        <div style="margin-top:10px;">
          <label>Comentario de cierre</label>
          <textarea id="cierre-com-${r.id}"></textarea>
          <label>Foto de evidencia</label>
          <input type="file" id="cierre-foto-${r.id}" accept="image/*">
          <button class="secondary" onclick="cerrarReporteUI('${r.id}')">Cerrar reporte</button>
        </div>` : ''}
      ${SESSION.rol === 'Master' ? `<button class="secondary" style="width:auto;padding:4px 10px;margin-top:8px;color:var(--red);border-color:var(--red);" onclick="borrarReporteUI('${r.id}')">Borrar (dato de prueba)</button>` : ''}
    </div>
  `).join('');
}

function borrarReporteUI(id) {
  if (!confirm('¿Borrar este reporte definitivamente? Úsalo solo para datos de prueba, no hay forma de deshacerlo.')) return;
  callApi('borrarReporte', { emailActor: SESSION.email, id }).then(cargarReportes).catch(err => alert(err.message));
}

function cerrarReporteUI(id) {
  const comentario = document.getElementById('cierre-com-' + id).value.trim();
  const fotoInput = document.getElementById('cierre-foto-' + id);
  const file = fotoInput.files[0];
  if (!file) { alert('La foto de evidencia es obligatoria.'); return; }
  if (!comentario) { alert('El comentario de cierre es obligatorio.'); return; }
  comprimirImagen(file)
    .then(fotoEvidencia => callApi('cerrarReporte', { emailActor: SESSION.email, id, fotoEvidencia, comentario }))
    .then(() => cargarReportes())
    .catch(err => alert(err.message));
}

// ============ DASHBOARD ============
let chartInsecto, chartArea;

document.addEventListener('click', e => {
  if (e.target.matches('#dash-filtros button')) {
    document.querySelectorAll('#dash-filtros button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('rango-fechas').classList.toggle('hidden', e.target.dataset.r !== 'rango');
    if (e.target.dataset.r !== 'rango') cargarDashboard();
  }
});

function rangoFechasActual() {
  const activo = document.querySelector('#dash-filtros button.active');
  const tipo = activo ? activo.dataset.r : 'hoy';
  const hoy = new Date();
  let desde, hasta;
  if (tipo === 'hoy') {
    desde = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
    hasta = new Date();
  } else if (tipo === 'ayer') {
    desde = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - 1);
    hasta = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  } else if (tipo === 'semana') {
    const dia = hoy.getDay() === 0 ? 7 : hoy.getDay(); // lunes=1..domingo=7
    desde = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - (dia - 1));
    hasta = new Date();
  } else {
    desde = new Date(document.getElementById('rango-desde').value || hoy);
    hasta = new Date(document.getElementById('rango-hasta').value || hoy);
  }
  return { desde, hasta };
}

function cargarDashboard() {
  const { desde, hasta } = rangoFechasActual();
  callApi('obtenerReportes', { filtros: JSON.stringify({ desde, hasta, hotel: 'DRRPC' }) }).then(reportes => {
    pintarKPIs(reportes);
    pintarCharts(reportes);
  });
  callApi('coberturaPreventiva', {}).then(pintarHeatmap);
}

function pintarKPIs(reportes) {
  const total = reportes.length;
  const pendientes = reportes.filter(r => r.estado === 'Pendiente').length;
  const realizados = reportes.filter(r => r.estado === 'Realizado').length;
  const alta = reportes.filter(r => r.severidad === 'Alta').length;
  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi" style="cursor:pointer;" onclick="irAReportesConFiltro('todos')"><div class="label">Total reportes</div><div class="value">${total}</div></div>
    <div class="kpi" style="cursor:pointer;" onclick="irAReportesConFiltro('pendiente')"><div class="label">Pendientes</div><div class="value">${pendientes}</div></div>
    <div class="kpi" style="cursor:pointer;" onclick="irAReportesConFiltro('realizado')"><div class="label">Realizados</div><div class="value">${realizados}</div></div>
    <div class="kpi" style="cursor:pointer;" onclick="irAReportesConFiltro('alta')"><div class="label">Alta severidad</div><div class="value">${alta}</div></div>
  `;
}

function contarPor(reportes, campo) {
  const conteo = {};
  reportes.forEach(r => { conteo[r[campo]] = (conteo[r[campo]] || 0) + 1; });
  return conteo;
}

function pintarCharts(reportes) {
  const porInsecto = contarPor(reportes, 'tipoInsecto');
  const porArea = contarPor(reportes, 'area');

  if (chartInsecto) chartInsecto.destroy();
  chartInsecto = new Chart(document.getElementById('chart-insecto'), {
    type: 'bar',
    data: { labels: Object.keys(porInsecto), datasets: [{ label: 'Reportes', data: Object.values(porInsecto), backgroundColor: '#1D9E75' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });

  if (chartArea) chartArea.destroy();
  chartArea = new Chart(document.getElementById('chart-area'), {
    type: 'doughnut',
    data: { labels: Object.keys(porArea), datasets: [{ data: Object.values(porArea), backgroundColor: ['#0F6E56','#BA7517','#A32D2D','#378ADD','#7F77DD','#D85A30'] } ] },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

function pintarHeatmap(cobertura) {
  const cont = document.getElementById('heat-grid');
  cont.innerHTML = cobertura.map(c => {
    const p = c.porcentaje;
    const bg = p >= 80 ? '#B5D4F4' : p >= 60 ? '#85B7EB' : p >= 40 ? '#B5D4F4' : '#E6F1FB';
    const fg = p >= 60 ? '#0C447C' : '#185FA5';
    return `<div class="heat-cell" style="background:${bg};color:${fg};">
      <div class="b">${c.edificio}</div><div class="p">${p}%</div>
    </div>`;
  }).join('');
}

function exportarPDFSeleccionados() {
  const ids = Array.from(document.querySelectorAll('.chk-reporte:checked')).map(c => c.value);
  if (!ids.length) { alert('Selecciona al menos un reporte con el checkbox.'); return; }
  const seleccionados = REPORTES_CACHE.filter(r => ids.indexOf(r.id) !== -1);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter', orientation: 'portrait' }); // carta vertical
  const anchoUtil = 540; // 612pt carta - márgenes
  const margenX = 36;
  let y = 40;
  const compacto = seleccionados.length > 1;
  const alturaImg = compacto ? 110 : 220;

  doc.setFontSize(14);
  doc.text('Reporte de Control de Fumigación', margenX, y); y += 18;
  doc.setFontSize(9);
  doc.text('Generado: ' + new Date().toLocaleString('es-DO'), margenX, y); y += 20;

  seleccionados.forEach((r, idx) => {
    if (y > 700) { doc.addPage(); y = 40; }
    doc.setFontSize(11);
    doc.text((r.area === 'Habitacion' ? 'Habitación ' + r.habitacion : r.area) + ' · ' + r.tipoInsecto, margenX, y); y += 14;
    doc.setFontSize(9);
    doc.text('Estado: ' + r.estado + ' · ' + new Date(r.fechaHora).toLocaleString('es-DO') + (r.severidad === 'Alta' ? ' · Alta severidad' : ''), margenX, y); y += 12;
    if (r.observaciones) { doc.text('Obs: ' + r.observaciones, margenX, y, { maxWidth: anchoUtil }); y += 12; }
    if (r.fotoInicial) {
      try { doc.addImage(r.fotoInicial, 'JPEG', margenX, y, alturaImg * 1.3, alturaImg); y += alturaImg + 8; } catch (e) {}
    }
    if (r.estado === 'Realizado') {
      doc.text('Cierre por: ' + r.usuarioCierre + ' — ' + (r.comentarioCierre || ''), margenX, y, { maxWidth: anchoUtil }); y += 12;
      if (r.fotoEvidencia) {
        try { doc.addImage(r.fotoEvidencia, 'JPEG', margenX, y, alturaImg * 1.3, alturaImg); y += alturaImg + 8; } catch (e) {}
      }
    }
    y += 10;
    if (idx < seleccionados.length - 1) { doc.setDrawColor(220); doc.line(margenX, y - 5, margenX + anchoUtil, y - 5); }
  });

  doc.save('reportes_fumigacion_' + Date.now() + '.pdf');
}

function exportarPDF() {
  const { desde, hasta } = rangoFechasActual();
  callApi('resumenDetallado', { desde: desde.toISOString(), hasta: hasta.toISOString(), hotel: 'DRRPC' }).then(r => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'letter', orientation: 'portrait' });
    const margenX = 36;
    const anchoUtil = 540;
    let y = 40;

    const titulo = (t) => { if (y > 730) { doc.addPage(); y = 40; } doc.setFontSize(12); doc.setFont(undefined, 'bold'); doc.text(t, margenX, y); y += 16; doc.setFont(undefined, 'normal'); };
    const linea = (t) => { if (y > 740) { doc.addPage(); y = 40; } doc.setFontSize(9); doc.text(t, margenX, y, { maxWidth: anchoUtil }); y += 12; };

    doc.setFontSize(15);
    doc.text('Reporte de Control de Fumigación', margenX, y); y += 18;
    doc.setFontSize(11);
    doc.text(r.nombreHotel, margenX, y); y += 15;
    doc.setFontSize(9);
    doc.text('Datos correspondientes a: ' + desde.toLocaleDateString('es-DO') + ' – ' + hasta.toLocaleDateString('es-DO'), margenX, y); y += 20;

    titulo('TOTAL REPORTES: ' + r.totalReportes);
    r.detalleReportes.forEach(d => linea('• ' + d));
    y += 8;

    titulo('PENDIENTES: ' + r.pendientes);
    r.detallePendientes.forEach(d => linea('• ' + d));
    y += 8;

    titulo('REALIZADOS: ' + r.realizados);
    r.detalleRealizados.forEach(d => linea('• ' + d));
    y += 8;

    titulo('ALTA SEVERIDAD: ' + r.altaSeveridad);
    r.detalleAltaSeveridad.forEach(d => linea('• ' + d));
    y += 8;

    titulo('FUMIGACIÓN PREVENTIVA: ' + r.totalPreventivo);
    r.detallePreventivo.forEach(d => linea('• ' + d));
    y += 8;

    titulo('COBERTURA PREVENTIVA GLOBAL POR EDIFICIO (últimos 15 días)');
    r.cobertura.forEach(c => linea('• ' + c.edificio + ': ' + c.porcentaje + '% (' + c.cubiertas + '/' + c.total + ')'));

    doc.save('reporte_fumigacion_' + Date.now() + '.pdf');
  }).catch(err => alert(err.message));
}

function compartir() {
  if (navigator.share) {
    navigator.share({ title: 'Control de Fumigación', url: window.location.href });
  } else {
    navigator.clipboard.writeText(window.location.href);
    alert('Link copiado al portapapeles.');
  }
}

// ============ USUARIOS ============
function cargarUsuarios() {
  callApi('listarUsuarios', { emailActor: SESSION.email }).then(usuarios => {
    document.getElementById('lista-usuarios').innerHTML = usuarios.map(u => `
      <div class="user-row ${u.estado === 'Inactivo' ? 'inactive-row' : ''}">
        <div>${u.nombre}<div class="role">${u.email} · ${u.rol}${u.clave ? ' · Código: <strong>' + u.clave + '</strong>' : ''}</div></div>
        <div>
          <span class="badge ${u.estado === 'Activo' ? 'realizado' : 'pendiente'}">${u.estado}</span>
          ${u.estado === 'Activo' ? `<button class="secondary" style="width:auto;padding:4px 10px;margin-left:6px;" onclick="inactivarUsuarioUI('${u.email}')">Inactivar</button>` : ''}
        </div>
      </div>
    `).join('');
  });
}

function crearUsuarioUI() {
  const nombre = document.getElementById('us-nombre').value.trim();
  const email = document.getElementById('us-email').value.trim();
  const rol = document.getElementById('us-rol').value;
  callApi('crearUsuario', { emailActor: SESSION.email, email, nombre, rol })
    .then(res => {
      document.getElementById('us-msg').innerHTML =
        '<div class="msg ok">Usuario creado. Clave asignada: <strong>' + res.clave + '</strong></div>';
      document.getElementById('us-nombre').value = '';
      document.getElementById('us-email').value = '';
      cargarUsuarios();
    })
    .catch(err => {
      document.getElementById('us-msg').innerHTML = '<div class="msg error">' + err.message + '</div>';
    });
}

function inactivarUsuarioUI(email) {
  if (!confirm('¿Inactivar a ' + email + '? El histórico se conserva, solo pierde acceso.')) return;
  callApi('inactivarUsuario', { emailActor: SESSION.email, emailObjetivo: email }).then(cargarUsuarios);
}
